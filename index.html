<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linksland - Player Profiles</title>
  <style>
    :root {
      /* Palette: Deep Reds, Fiery Oranges, Warm Yellows */
      --bg-dark: #120707;
      --bg-card: #1c0d0d;
      --bg-card-hover: #2a1212;
      
      --primary-red: #d92b2b;
      --accent-orange: #f26419;
      --highlight-yellow: #f6ae2d;
      
      --text-main: #fcfcfc;
      --text-muted: #e0a98b;
      --text-dark: #1a0808;
      
      --border-color: #4a1515;
      --shadow-glow: rgba(242, 100, 25, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Banner */
    header.hero-banner {
      background: linear-gradient(135deg, #800e0e 0%, #d92b2b 40%, #f26419 75%, #f6ae2d 100%);
      padding: 2.5rem 1rem;
      text-align: center;
      box-shadow: 0 4px 20px var(--shadow-glow);
      position: relative;
    }

    header.hero-banner h1 {
      font-size: 2.5rem;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    header.hero-banner p {
      color: #ffe6aa;
      font-size: 1.1rem;
      margin-top: 0.5rem;
      font-weight: 500;
    }

    /* Container */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
      width: 100%;
      flex: 1;
    }

    /* Season Tabs */
    .tabs-container {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background-color: var(--bg-card);
      border: 2px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.6rem 1.4rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn:hover {
      border-color: var(--accent-orange);
      color: var(--highlight-yellow);
      box-shadow: 0 0 10px var(--shadow-glow);
    }

    .tab-btn.active {
      background: linear-gradient(45deg, var(--primary-red), var(--accent-orange));
      color: #ffffff;
      border-color: var(--highlight-yellow);
      box-shadow: 0 0 15px var(--shadow-glow);
    }

    /* Grid Layout */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    /* Player Profile Cards */
    .player-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .player-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-orange);
      box-shadow: 0 8px 24px var(--shadow-glow);
      background-color: var(--bg-card-hover);
    }

    .card-header {
      background: linear-gradient(90deg, var(--primary-red), var(--accent-orange));
      padding: 1rem;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header h3 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .rank-badge {
      background-color: var(--highlight-yellow);
      color: var(--text-dark);
      font-size: 0.85rem;
      font-weight: 800;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      flex: 1;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 0.4rem;
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .stat-value {
      color: var(--highlight-yellow);
      font-weight: 600;
      font-size: 1rem;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 1.5rem;
      background-color: #0d0404;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Top Red/Orange/Yellow Gradient Banner -->
  <header class="hero-banner">
    <h1>Linksland Dashboard</h1>
    <p>Seasonal Leaderboards & Player Profiles</p>
  </header>

  <main>
    <!-- Dynamic Season Navigation Tabs -->
    <div class="tabs-container" id="season-tabs">
      <button class="tab-btn active" data-season="season1">Season 1</button>
      <button class="tab-btn" data-season="season2">Season 2</button>
      <button class="tab-btn" data-season="season3">Season 3</button>
      <button class="tab-btn" data-season="season4">Season 4</button>
      <button class="tab-btn" data-season="season5">Season 5</button>
    </div>

    <!-- Cards Container -->
    <div class="cards-grid" id="player-grid">
      <!-- Player cards will be rendered here dynamically -->
    </div>
  </main>

  <footer>
    <p>&copy; Linksland. Powered by merged season dataset.</p>
  </footer>

  <script>
    let allData = {};

    async function init() {
      try {
        const response = await fetch('data.json');
        allData = await response.json();
        
        setupTabListeners();
        const defaultSeason = Object.keys(allData)[0] || 'season1';
        renderCards(defaultSeason);
      } catch (err) {
        console.error('Failed to load data.json:', err);
        document.getElementById('player-grid').innerHTML = 
          `<p style="color: var(--primary-red); grid-column: 1/-1; text-align: center;">
            Failed to load data. Please ensure <strong>data.json</strong> is in the same directory.
          </p>`;
      }
    }

    function setupTabListeners() {
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(tab => {
        tab.addEventListener('click', (e) => {
          tabs.forEach(t => t.classList.remove('active'));
          e.target.classList.add('active');
          
          const selectedSeason = e.target.getAttribute('data-season');
          renderCards(selectedSeason);
        });
      });
    }

    function renderCards(seasonKey) {
      const grid = document.getElementById('player-grid');
      grid.innerHTML = '';

      const players = allData[seasonKey] || [];

      if (players.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No data available for ${seasonKey}.</p>`;
        return;
      }

      players.forEach((player, index) => {
        const card = document.createElement('div');
        card.className = 'player-card';

        const name = player.name || player.player || `Player ${index + 1}`;
        const rank = player.rank || `#${index + 1}`;
        
        let statsHtml = '';
        for (const [key, value] of Object.entries(player)) {
          // Exclude name, rank, and r2 (or round 2)
          if (['name', 'player', 'rank', 'r2', 'round 2', 'round2'].includes(key.toLowerCase())) continue;
          
          statsHtml += `
            <div class="stat-row">
              <span class="stat-label">${key.toUpperCase()}</span>
              <span class="stat-value">${value}</span>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="card-header">
            <h3>${name}</h3>
            <span class="rank-badge">${rank}</span>
          </div>
          <div class="card-body">
            ${statsHtml}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    init();
  </script>
</body>
</html>
