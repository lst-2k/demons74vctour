<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demon's Stock 74 VC Tour - Leaderboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --fire-red: #d32f2f; 
            --fire-crimson: #800000;
            --fire-orange: #ff6f00; 
            --fire-yellow: #ffb300; 
            --glow-gold: #ffd54f;
            --dark-bg: #120909; 
            --card-bg: #1c1313;
            --table-header: #2a1414;
            --border-color: #3d1c1c;
            --text-main: #f5f5f5;
            --text-muted: #b0a0a0;
            --ps-blue: #40a9ff; 
            --xbox-green: #4caf50; 
            --steam-blue: #90caf9; 
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--dark-bg); 
            background-image: radial-gradient(circle at top center, #2a0808 0%, #120909 70%);
            padding: 0; 
            color: var(--text-main); 
            margin: 0; 
            font-size: 14px; 
            min-height: 100vh;
        }

        .league-banner { 
            background: #0a0404; 
            text-align: center; 
            border-bottom: 3px solid var(--fire-orange); 
            width: 100%; 
            box-shadow: 0 4px 20px rgba(255, 111, 0, 0.25);
        }

        .league-logo { 
            width: 100%; 
            max-width: 1000px;
            height: auto; 
            display: block; 
            margin: auto;
        }

        .main-content { 
            width: 100%; 
            max-width: 1000px; 
            margin: auto; 
            padding-bottom: 50px; 
        }
        
        .section-header { 
            padding: 14px 18px; 
            background: var(--card-bg); 
            border-bottom: 2px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: 0.3s; 
        }
        .section-header.is-major { 
            background: linear-gradient(90deg, #3a0000 0%, #1c1313 100%); 
            color: white; 
            border-bottom: 2px solid var(--fire-yellow); 
        }
        
        .header-text-group { display: flex; flex-direction: column; }
        #venueName { margin: 0; font-size: 1.3em; font-weight: 800; color: var(--fire-yellow); text-transform: uppercase; letter-spacing: 0.5px; }
        #eventDateLabel { margin: 4px 0 0 0; font-size: 0.85em; color: var(--text-muted); font-weight: 500; }
        .is-major #eventDateLabel { color: #e0b0b0; } 
        
        .major-tag { 
            background: linear-gradient(135deg, var(--fire-yellow) 0%, var(--fire-orange) 100%); 
            color: #000; 
            padding: 5px 14px; 
            border-radius: 4px; 
            font-size: 0.75em; 
            font-weight: 900; 
            letter-spacing: 1px; 
            box-shadow: 0 0 10px rgba(255, 179, 0, 0.4); 
        } 
        
        .scroller { 
            width: 100%; 
            overflow-x: auto; 
            background: var(--card-bg); 
            border-bottom: 2px solid var(--border-color); 
            margin-bottom: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        table { width: 100%; border-collapse: collapse; background: var(--card-bg); }
        th { 
            background: var(--table-header); 
            color: var(--fire-yellow); 
            padding: 12px 8px; 
            font-size: 11px; 
            text-transform: uppercase; 
            white-space: nowrap; 
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 0.5px;
        }
        td { 
            padding: 10px 6px; 
            border-bottom: 1px solid var(--border-color); 
            text-align: center; 
            white-space: nowrap; 
            font-size: 13px; 
            color: var(--text-main);
        }
        
        .player-col { text-align: left !important; padding-left: 15px; font-weight: 600; }
        .fa-brands { font-size: 1em; vertical-align: middle; margin-right: 6px; width: 18px; text-align: center; }
        .fa-playstation { color: var(--ps-blue); } 
        .fa-xbox { color: var(--xbox-green); } 
        .fa-steam { color: var(--steam-blue); }
        
        .to-par-cell { font-weight: 900; font-size: 1em; background: #150a0a; width: 55px; }
        .under-par { color: #ff4d4d; text-shadow: 0 0 6px rgba(255, 77, 77, 0.4); }
        .even-par { color: var(--fire-yellow); font-weight: bold; }
        .over-par { color: var(--text-muted); }
        .wins-col { color: var(--fire-orange); font-weight: bold; }
        .rank-up { color: #4caf50; font-size: 0.85em; }
        .rank-down { color: #ff4d4d; font-size: 0.85em; }
        .rank-steady { color: #777; font-size: 0.85em; }
        .trend-col { width: 30px; text-align: center; }
        
        h3 { 
            color: var(--fire-orange); 
            font-size: 1.1em; 
            padding: 12px 15px; 
            margin: 0; 
            background: #150a0a; 
            border-bottom: 1px solid var(--border-color); 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        
        .history-header { 
            background: var(--card-bg); 
            padding: 12px 15px; 
            border: 1px solid var(--border-color); 
            margin-top: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-left: 5px solid var(--fire-orange); 
            font-size: 13px !important; 
            text-transform: none; 
            color: var(--text-main);
        }
        .history-header.major-border { border-left-color: var(--fire-yellow); }
        .history-header::after { content: '\f0d7'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: var(--fire-yellow); }
        .history-content { display: none; background: var(--card-bg); border: 1px solid var(--border-color); border-top: none; padding: 10px; }
    </style>
</head>
<body>

<header class="league-banner">
    <img src="logo.png" alt="Demon's Stock 74 VC Tour" class="league-logo" onerror="this.style.display='none'">
</header>

<div class="main-content">
    <div id="headerBar" class="section-header">
        <div class="header-text-group">
            <h2 id="venueName">🔥 Loading...</h2>
            <p id="eventDateLabel"></p>
        </div>
        <div id="sigStatus"></div>
    </div>

    <h3>Tournament Results</h3>
    <div class="scroller">
        <table>
            <thead>
                <tr><th>Pos</th><th class="player-col">Player</th><th>To Par</th><th>R1</th><th>Pts</th></tr>
            </thead>
            <tbody id="liveBody"></tbody>
        </table>
    </div>

    <h3>Season Standings</h3>
    <div class="scroller">
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th class="trend-col"></th>
                    <th class="player-col">Player</th>
                    <th>Played</th>
                    <th>Wins</th>
                    <th>ACC</th>
                    <th>Total Points</th>
                </tr>
            </thead>
            <tbody id="seasonBody"></tbody>
        </table>
    </div>

    <div id="historyContainer"></div>
</div>

<script>
    async function loadLeaderboard() {
        try {
            const response = await fetch('data.json');
            const data = await response.json();
            
            // Header Info
            const headerBar = document.getElementById('headerBar');
            document.getElementById('venueName').innerText = `🔥 ${data.currentEvent.venue || 'Tournament'}`;
            document.getElementById('eventDateLabel').innerText = data.currentEvent.date || '';
            
            if(data.currentEvent.isSig) {
                headerBar.classList.add('is-major');
                document.getElementById('sigStatus').innerHTML = '<span class="major-tag">🏆 MAJOR</span>';
            } else {
                headerBar.classList.remove('is-major');
                document.getElementById('sigStatus').innerHTML = '';
            }

            // 1. Process Current Event
            const currentResults = processEventResults(data.currentEvent);
            renderLeaderboard(currentResults);

            // 2. Process All Past Events + Current Event for Season Standings
            const allEvents = [...(data.pastEvents || []), data.currentEvent];
            const seasonStats = calculateSeasonStandings(allEvents);
            renderStandings(seasonStats);

            // 3. Render Dynamic History
            renderHistory(data.pastEvents || []);

        } catch (e) { console.error("Error loading data.json:", e); }
    }

    function getPlatformIcon(p) {
        const c = (p || "").toLowerCase();
        if (c.includes('ps')) return '<i class="fa-brands fa-playstation"></i>';
        if (c.includes('xb')) return '<i class="fa-brands fa-xbox"></i>';
        return '<i class="fa-brands fa-steam"></i>';
    }

    function getBasePtsForRank(rank, isSig) {
        let base = rank === 1 ? 200 : rank === 2 ? 175 : rank === 3 ? 150 : rank === 4 ? 100 : Math.max(10, 100 - ((rank - 4) * 10));
        return isSig ? base * 2 : base;
    }

    // Process player scores for a single tournament event with tie-splitting logic
    function processEventResults(eventData) {
        const par = parseInt(eventData.par) || 72;
        let activePlayers = eventData.players.map(p => {
            const s = [p.r1, p.r2, p.r3, p.r4].map(v => parseInt(v)||0).filter(v => v > 0);
            const total = s.reduce((a,b) => a+b, 0);
            return { ...p, total, toPar: s.length > 0 ? total - (s.length * par) : 999, active: s.length };
        }).filter(p => p.active > 0).sort((a,b) => a.toPar - b.toPar);

        let results = [];
        let i = 0;
        while (i < activePlayers.length) {
            let j = i;
            while (j < activePlayers.length && activePlayers[j].toPar === activePlayers[i].toPar) {
                j++;
            }
            
            const tiedCount = j - i;
            let sumBasePts = 0;
            
            for (let r = i + 1; r <= j; r++) {
                sumBasePts += getBasePtsForRank(r, eventData.isSig);
            }
            
            const splitBasePts = sumBasePts / tiedCount;
            const rankLabel = tiedCount > 1 ? `T${i + 1}` : `${i + 1}`;

            for (let k = i; k < j; k++) {
                const p = activePlayers[k];
                const bVal = eventData.isSig ? 20 : 10;
                const bonus = ((parseInt(p.birdies) > 0) ? bVal : 0) + (p.isLow ? bVal : 0);
                const finalPts = splitBasePts + bonus;

                results.push({
                    ...p,
                    rank: i + 1,
                    rankLabel,
                    pts: finalPts
                });
            }
            i = j;
        }
        return results;
    }

    function renderLeaderboard(results) {
        const lBody = document.getElementById('liveBody');
        lBody.innerHTML = '';

        results.forEach(p => {
            const toParDisp = p.toPar === 0 ? "E" : (p.toPar > 0 ? `+${p.toPar}` : p.toPar);
            const ptsDisp = Number.isInteger(p.pts) ? p.pts : p.pts.toFixed(1);

            lBody.innerHTML += `<tr>
                <td>${p.rankLabel}</td>
                <td class="player-col">${getPlatformIcon(p.console)} ${p.name}</td>
                <td class="to-par-cell ${p.toPar < 0 ? 'under-par' : (p.toPar === 0 ? 'even-par' : '')}">${toParDisp}</td>
                <td>${p.r1||'-'}</td>
                <td style="color:var(--fire-yellow); font-weight:bold;">${ptsDisp}</td>
            </tr>`;
        });
    }

    // Calculates overall cumulative season stats across all played events
    function calculateSeasonStandings(allEvents) {
        const stats = {};

        // Calculate up to previous event to get prevRank
        const previousEvents = allEvents.slice(0, -1);
        const prevStandingsMap = {};
        
        if (previousEvents.length > 0) {
            const prevSeason = calculateSeasonStandings(previousEvents);
            prevSeason.forEach((p, idx) => {
                prevStandingsMap[p.name] = idx + 1;
            });
        }

        allEvents.forEach((event) => {
            const eventResults = processEventResults(event);
            eventResults.forEach(p => {
                if (!stats[p.name]) {
                    stats[p.name] = {
                        name: p.name,
                        console: p.console,
                        points: 0,
                        eventsPlayed: 0,
                        wins: 0,
                        acc: 0,
                        prevRank: prevStandingsMap[p.name] || null
                    };
                }

                stats[p.name].points += p.pts;
                stats[p.name].eventsPlayed += 1;
                stats[p.name].acc += p.toPar;
                if (p.rank === 1) stats[p.name].wins += 1;
            });
        });

        return Object.values(stats).sort((a,b) => b.points - a.points);
    }

    function renderStandings(sorted) {
        const sBody = document.getElementById('seasonBody');
        if (!sBody) return;
        sBody.innerHTML = '';

        let i = 0;
        while (i < sorted.length) {
            let j = i;
            while (j < sorted.length && sorted[j].points === sorted[i].points) j++;
            
            const tiedCount = j - i;
            const rankLabel = tiedCount > 1 ? `T${i + 1}` : `${i + 1}`;

            for (let k = i; k < j; k++) {
                const p = sorted[k];
                const currentRank = i + 1;
                const previousRank = p.prevRank || currentRank;
                
                let trendHtml = '<span class="rank-steady">●</span>';
                if (currentRank < previousRank) {
                    trendHtml = '<span class="rank-up"><i class="fa-solid fa-caret-up"></i></span>';
                } else if (currentRank > previousRank) {
                    trendHtml = '<span class="rank-down"><i class="fa-solid fa-caret-down"></i></span>';
                }

                const accDisp = p.acc === 0 ? "E" : (p.acc > 0 ? `+${p.acc}` : p.acc);
                const accClass = p.acc < 0 ? "under-par" : (p.acc === 0 ? "even-par" : "");
                const ptsDisp = Number.isInteger(p.points) ? p.points : p.points.toFixed(1);

                sBody.innerHTML += `<tr>
                    <td>${rankLabel}</td>
                    <td class="trend-col">${trendHtml}</td>
                    <td class="player-col">${getPlatformIcon(p.console)} ${p.name}</td>
                    <td>${p.eventsPlayed}</td>
                    <td style="font-weight:bold; color:var(--fire-orange);">${p.wins}</td>
                    <td style="font-weight:bold;" class="${accClass}">${accDisp}</td>
                    <td style="color:var(--fire-yellow); font-weight:bold;">${ptsDisp}</td>
                </tr>`;
            }
            i = j;
        }
    }

    function renderHistory(pastEvents) {
        const hContainer = document.getElementById('historyContainer');
        if (!hContainer || pastEvents.length === 0) return;

        let html = `<h3>Weekly History</h3>`;
        
        // Display past events with most recent first
        [...pastEvents].reverse().forEach(event => {
            const results = processEventResults(event);
            const isMajor = event.isSig ? "major-border" : "";
            
            html += `<div class="history-header ${isMajor}" onclick="toggleHistory(this)">
                ${event.venue} (${event.date}) ${event.isSig ? '🏆' : ''}
            </div>
            <div class="history-content">
                <table>
                    <tr><th>Pos</th><th class="player-col">Player</th><th>Par</th><th>Tot</th></tr>`;
            
            results.forEach(p => {
                const toParDisp = p.toPar === 0 ? "E" : (p.toPar > 0 ? `+${p.toPar}` : p.toPar);
                const parClass = p.toPar < 0 ? "under-par" : (p.toPar === 0 ? "even-par" : "over-par");

                html += `<tr>
                    <td>${p.rankLabel}</td>
                    <td class="player-col">${getPlatformIcon(p.console)} ${p.name}</td>
                    <td class="${parClass}">${toParDisp}</td>
                    <td>${p.total}</td>
                </tr>`;
            });

            html += `</table></div>`;
        });

        hContainer.innerHTML = html;
    }

    function toggleHistory(header) {
        const content = header.nextElementSibling;
        const isVisible = content.style.display === "block";
        document.querySelectorAll('.history-content').forEach(c => c.style.display = "none");
        content.style.display = isVisible ? "none" : "block";
    }

    window.onload = loadLeaderboard;
</script>
</body>
</html>
